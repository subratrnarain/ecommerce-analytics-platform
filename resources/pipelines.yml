# Filename: resources/pipelines.yml
resources:
  postgres_projects:
    my_app:
      project_id: 'lakebase-test-project'
      display_name: 'lakebase-test-project'
      pg_version: 17

  postgres_branches:
    dev_branch:
      parent: ${resources.postgres_projects.my_app.id}
      branch_id: 'dev'
      no_expiry: true

  postgres_endpoints:
    dev_endpoint:
      parent: ${resources.postgres_branches.dev_branch.id}
      endpoint_id: 'primary'
      endpoint_type: 'ENDPOINT_TYPE_READ_WRITE'
      autoscaling_limit_min_cu: 0.5
      autoscaling_limit_max_cu: 2

  pipelines:
    ecommerce_behavior_pipeline:
      name: ${bundle.target}-ecommerce-behavior-pipeline
      target: ${bundle.target}_silver_layer
      libraries:
        - notebook:
            path: ../src/dlt_pipelines/streaming_pipeline.py
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 5
            mode: ENHANCED
      continuous: false
      development: true
      catalog: workspace

  synced_database_tables:
    # Key for this specific table sync
    product_metrics_sync:
      # The source table
      source_table_full_name: "workspace.gold_layer.product_performance_metrics"
      # The DESTINATION (Lakebase)
      # Reference defined earlier
      parent: ${resources.postgres_projects.my_app.id}
      target_database: "databricks_postgres"
      target_schema: "gold_layer"
      target_table: "product_perf_matrics_sync"
      # Sync Mode: CONTINUOUS, TRIGGERED, or SNAPSHOT
      sync_mode: "CONTINUOUS"

    # Second Table: User Behavior
    user_behavior_sync:
      parent: ${resources.postgres_projects.my_app.id}
      source_table_full_name: "main.gold_layer.product_performance"
      target_database: "databricks_postgres"
      target_schema: "gold_layer"
      target_table: "product_per_sync"
      sync_mode: "TRIGGERED"