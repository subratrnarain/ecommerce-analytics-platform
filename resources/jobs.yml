resources:
  jobs:
    ecommerce_etl_job:
      name: ecommerce_etl_job
      tasks:
        - task_key: Bronze_Ingestion
          notebook_task:
            notebook_path: ../src/notebooks/bronze_ingestion.py

        - task_key: Silver_Streaming
          depends_on:
            - task_key: Bronze_Ingestion
          pipeline_task:
            # Reference the resource key of DLT pipeline
            pipeline_id: ${resources.pipelines.streaming_pipeline.id}

        - task_key: Gold_Aggregation
          depends_on:
            - task_key: Silver_Streaming
          notebook_task:
            notebook_path: ../src/notebooks/gold_aggregation.py